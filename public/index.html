<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BotWebsite</title>
    <meta
      name="description"
      content="Site de discussion avec un bot intelligent. Hébergé sur GitHub Pages."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">B</div>
          <span>BotWebsite</span>
        </div>
        <button class="ghost-button" id="resetChat">Nouvelle discussion</button>
      </header>

      <main class="chat-container">
        <section class="sidebar">
          <div class="sidebar-header">
            <p class="eyebrow">Assistant</p>
            <h1>Discussion</h1>
          </div>

          <div class="quick-actions">
            <button class="chip" data-message="Bonjour, pouvez-vous m'aider ?">Bonjour</button>
            <button class="chip" data-message="Quels services proposez-vous ?">Services</button>
            <button class="chip" data-message="Comment puis-je contacter le support ?">Support</button>
            <button class="chip" data-message="Expliquez-moi votre site web de discussion">Présentation</button>
          </div>

          <div class="status-card">
            <span class="status-dot"></span>
            <p>Bot en ligne</p>
          </div>
        </section>

        <section class="chat-panel">
          <div class="messages" id="messages">
            <div class="message bot">
              <div class="avatar">B</div>
              <div class="bubble">
                Bonjour ! Je suis votre assistant. Posez-moi une question et je vous répondrai de manière claire et utile.
              </div>
            </div>
          </div>

          <form class="composer" id="chatForm">
            <label class="sr-only" for="messageInput">Votre message</label>
            <input
              id="messageInput"
              type="text"
              placeholder="Écrivez votre message..."
              autocomplete="off"
              required
            />
            <button type="submit">Envoyer</button>
          </form>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
